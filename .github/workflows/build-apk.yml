name: Build NEET Countdown APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'downloads/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap add android
      - name: Generate premium Android app icons
        run: node scripts/generate-icons.mjs
      - run: npx cap sync android
      - name: Create temporary Android debug keystore
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Print Android signing fingerprints
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEET-Countdown-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest NEET Countdown APK" --notes "Latest installable Android debug APK. Download NEET-Countdown.apk below."
          gh release upload latest android/app/build/outputs/apk/debug/app-debug.apk --clobber --name NEET-Countdown.apk
      - name: Add APK to repository
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/NEET-Countdown-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NEET-Countdown-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add latest NEET Countdown debug APK"
            git push
          fi
